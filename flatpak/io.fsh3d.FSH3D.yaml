app-id: io.fsh3d.FSH3D
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: fsh3d

finish-args:
  # Display: support both X11 and Wayland (Java Swing uses X11)
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # GPU for Java3D / JOGL (OpenGL)
  - --device=dri
  # File access: open/save .sh3d project files
  - --filesystem=home
  # Network: optional update check
  - --share=network
  # Audio: video export
  - --socket=pulseaudio

modules:
  # Step 1: Install OpenJDK 21 runtime into /app/jre
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
    sources: []

  # Step 2: Install the pre-built FSH3D JAR and supporting files
  - name: fsh3d
    buildsystem: simple
    sources:
      - type: file
        path: ../SweetHome3D/install/FSH3D-0.1.jar
        dest-filename: FSH3D.jar
      - type: file
        path: io.fsh3d.FSH3D.desktop
      - type: file
        path: io.fsh3d.FSH3D.metainfo.xml
      - type: file
        path: io.fsh3d.FSH3D.png
      - type: file
        path: io.fsh3d.FSH3D-32.png
      - type: file
        path: io.fsh3d.FSH3D-256.png
      - type: file
        path: io.fsh3d.FSH3D-512.png
      - type: file
        path: io.fsh3d.FSH3D.svg
      - type: file
        path: fsh3d.sh
    build-commands:
      # Install application JAR
      - install -Dm644 FSH3D.jar /app/share/fsh3d/FSH3D.jar
      # Install launcher script
      - install -Dm755 fsh3d.sh /app/bin/fsh3d
      # Install icons
      - install -Dm644 io.fsh3d.FSH3D.png /app/share/icons/hicolor/128x128/apps/io.fsh3d.FSH3D.png
      - install -Dm644 io.fsh3d.FSH3D-32.png /app/share/icons/hicolor/32x32/apps/io.fsh3d.FSH3D.png
      - install -Dm644 io.fsh3d.FSH3D-256.png /app/share/icons/hicolor/256x256/apps/io.fsh3d.FSH3D.png
      - install -Dm644 io.fsh3d.FSH3D-512.png /app/share/icons/hicolor/512x512/apps/io.fsh3d.FSH3D.png
      - install -Dm644 io.fsh3d.FSH3D.svg /app/share/icons/hicolor/scalable/apps/io.fsh3d.FSH3D.svg
      # Install desktop entry
      - install -Dm644 io.fsh3d.FSH3D.desktop /app/share/applications/io.fsh3d.FSH3D.desktop
      # Install appstream metadata
      - install -Dm644 io.fsh3d.FSH3D.metainfo.xml /app/share/metainfo/io.fsh3d.FSH3D.metainfo.xml
