app-id: org.cosyhome3d.CosyHome3D
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: cosyhome3d

finish-args:
  # Display: support both X11 and Wayland (Java Swing uses X11)
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # GPU for Java3D / JOGL (OpenGL)
  - --device=dri
  # File access: open/save .sh3d project files
  - --filesystem=home
  # Network: no longer needed since update check is disabled, to remove after tests
  - --share=network
  # Audio: video export
  - --socket=pulseaudio

modules:
  # Step 1: Install OpenJDK 21 runtime into /app/jre
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
    sources: []

  # Step 2: Install the pre-built Cosy Home 3D JAR and supporting files
  - name: cosyhome3d
    buildsystem: simple
    sources:
      - type: file
        path: ../SweetHome3D/install/CosyHome3D-0.1.1.jar
        dest-filename: CosyHome3D.jar
      - type: file
        path: org.cosyhome3d.CosyHome3D.desktop
      - type: file
        path: org.cosyhome3d.CosyHome3D.metainfo.xml
      - type: dir
        path: icons
        dest: icons
      - type: file
        path: cosyhome3d.sh
    build-commands:
      # Install application JAR
      - install -Dm644 CosyHome3D.jar /app/share/cosyhome3d/CosyHome3D.jar
      # Install launcher script
      - install -Dm755 cosyhome3d.sh /app/bin/cosyhome3d
      # Install one icon per standard size (generated by branding/generate.sh) and the scalable one
      - for s in 16 22 24 32 48 64 128 256 512; do install -Dm644 icons/org.cosyhome3d.CosyHome3D-$s.png /app/share/icons/hicolor/${s}x${s}/apps/org.cosyhome3d.CosyHome3D.png; done
      - install -Dm644 icons/org.cosyhome3d.CosyHome3D.svg /app/share/icons/hicolor/scalable/apps/org.cosyhome3d.CosyHome3D.svg
      # Install desktop entry
      - install -Dm644 org.cosyhome3d.CosyHome3D.desktop /app/share/applications/org.cosyhome3d.CosyHome3D.desktop
      # Install appstream metadata
      - install -Dm644 org.cosyhome3d.CosyHome3D.metainfo.xml /app/share/metainfo/org.cosyhome3d.CosyHome3D.metainfo.xml
