<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône temporaire FSH3D, style plan d'architecte (blueprint). Licence : GPL v2+, comme le projet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6cb8"/>
      <stop offset="1" stop-color="#16467f"/>
    </linearGradient>
    <pattern id="gridFine" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    </pattern>
    <clipPath id="shape"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#gridFine)"/>
    <rect width="512" height="512" fill="url(#gridMajor)"/>
    <!-- Lignes de construction -->
    <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 6">
      <line x1="0" y1="96" x2="512" y2="96"/>
      <line x1="0" y1="250" x2="512" y2="250"/>
      <line x1="0" y1="426" x2="512" y2="426"/>
    </g>
    <!-- Lettrage -->
    <g font-family="DejaVu Sans" font-weight="bold" text-anchor="middle" fill="none" stroke="#ffffff" stroke-linejoin="round">
      <text x="259" y="235" font-size="164" letter-spacing="4" stroke-opacity="0.35" stroke-width="3">FSH</text>
      <text x="256" y="232" font-size="164" letter-spacing="4" stroke-width="7">FSH</text>
      <text x="259" y="413" font-size="164" letter-spacing="8" stroke-opacity="0.35" stroke-width="3">3D</text>
      <text x="256" y="410" font-size="164" letter-spacing="8" stroke-width="7">3D</text>
    </g>
    <!-- Cotation sous "3D" -->
    <g stroke="#ffffff" stroke-width="3" fill="none">
      <line x1="150" y1="456" x2="362" y2="456"/>
      <line x1="150" y1="440" x2="150" y2="472"/>
      <line x1="362" y1="440" x2="362" y2="472"/>
      <line x1="142" y1="464" x2="158" y2="448"/>
      <line x1="354" y1="464" x2="370" y2="448"/>
    </g>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#0e2f57" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
</svg>
