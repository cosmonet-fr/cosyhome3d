<?xml version="1.0" encoding="UTF-8"?>
<!-- Icone provisoire Cosy Home 3D (64 px et plus), style plan d'architecte. Licence : GPL v2+, comme le projet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f78c8"/>
      <stop offset="1" stop-color="#15427a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)" clip-path="url(#tile)"/>
  <!-- Ombre du trace, decalee comme un calque -->
  <g fill="none" stroke="#0b2a52" stroke-opacity="0.45" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" transform="translate(8 10)">
    <path d="M62 262 L256 90 L450 262"/>
    <path d="M114 222 V438 H398 V222"/>
    <path d="M338 160 V100 H384 V200"/>
  </g>
  <!-- Maison -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 262 L256 90 L450 262"/>
    <path d="M114 222 V438 H398 V222"/>
    <path d="M338 160 V100 H384 V200"/>
  </g>
  <!-- Fumee de la cheminee -->
  <path d="M361 70 C340 56 380 44 360 22" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="13" stroke-linecap="round"/>
  <text x="256" y="402" font-family="DejaVu Sans" font-weight="bold" font-size="148" fill="#ffffff" text-anchor="middle">3D</text>
</svg>
