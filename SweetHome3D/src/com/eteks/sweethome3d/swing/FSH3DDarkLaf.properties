# Dark theme of FSH3D: navy blue derived from the logo instead of neutral gray.
# Text fields, lists, tables and the plan use the deepest blue, like a blueprint.

@background = #172a42
@foreground = #dce5f1
@componentBackground = #10203a
@buttonBackground = #213a5a
@menuBackground = #132439
@accentColor = #4a8ee0
@disabledForeground = #7d8ea6

Component.borderColor = #2d4568
Component.disabledBorderColor = #243a58
Component.focusWidth = 1
Component.arc = 6
Button.arc = 6
Separator.foreground = #2d4568
SplitPaneDivider.draggingColor = #4a8ee0
TableHeader.background = #1c3250
TableHeader.separatorColor = #2d4568
TableHeader.bottomSeparatorColor = #2d4568
Table.gridColor = #22385a
ToolTip.background = #213a5a
ScrollBar.track = #10203a
ScrollBar.thumb = #2d4568
ScrollBar.hoverThumbColor = #3a5884
